name: snapshot-workflow
run-name: Snapshot build of commit ${{ github.sha }} on branch ${{ github.ref }}
on:
  push:
    branches:
      - develop
  pull_request:
jobs:
  build-snapshot:
    name: Build Snapshot
    runs-on: ubuntu-latest
    steps:
      - run: echo "This job was automatically triggered by a ${{ github.event_name }} event."
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-package: 'jre'
          java-version: '25'
          check-latest: true
          cache: 'maven'
      - name: Run Maven
        run: |
          mvn -B -U clean package